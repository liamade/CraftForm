# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                               CraftForm                                      ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  OPERATIONS LAMBDA  ::  pyproject.toml                                       ║
# ║  What this lambda needs to run (the stuff that ships in the zip).            ║
# ║  dev tools live in the root one                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# pyproject doesn't inherit from the root so name, version and python gotta live here

[project]
name = "craftform-operations"
version = "0.0.0"               # unused, git tags version the releases
requires-python = "==3.12.*"    # the lambda runtime

# minimum versions, uv.lock pins them. no boto3 because lambda already ships it
dependencies = [
  "pynacl>=1.6.2",    # checks discord's signature on every interaction
  "urllib3>=2",       # the discord http calls
]

# it's just a folder that gets zipped, so uv installs the deps and never tries to build it
[tool.uv]
package = false


# ==========================================================================================
#                                 PYTEST
# ==========================================================================================
# lives here and not in the root so each package gets its own pytest. pythonpath lets tests
# import stuff the same way the lambda does, and keeps this index.py from fighting with startup's
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
