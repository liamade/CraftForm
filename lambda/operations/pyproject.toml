# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                               CraftForm                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  OPERATIONS LAMBDA  ::  pyproject.toml                                     ║
# ║  What this lambda needs to run (what ships in the zip).                    ║
# ║  dev tools are in the root one                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# pyproject doesn't inherit from the root, so name, version and python live here

[project]
name = "craftform-operations"
version = "0.0.0"               # unused, git tags version the releases
requires-python = "==3.12.*"    # the lambda runtime

# minimum versions, uv.lock pins them. no boto3 because lambda ships its own
dependencies = [
  "pynacl>=1.6.2",    # checks discord's signature on every interaction
  "urllib3>=2",       # discord http calls
]

# just a folder that gets zipped, so uv installs the deps and never builds it
[tool.uv]
package = false


# ==========================================================================================
#                                 PYTEST
# ==========================================================================================
# here and not in the root so each package gets its own pytest. pythonpath lets tests
# import things the same way the lambda does, and keeps the two index.py files apart
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
