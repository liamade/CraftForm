# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                               CraftForm                                      ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  STARTUP LAMBDA  ::  pyproject.toml                                          ║
# ║  What this lambda needs at RUNTIME -- the stuff that ships in the zip.       ║
# ║  Dev tools live in the root one.                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# how this connects to the root -- see the note in lambda/operations/pyproject.toml

[project]
name = "craftform-startup"
version = "0.0.0"               # unused -- git tags version the releases
requires-python = "==3.12.*"    # the lambda runtime, exactly

# floors, uv.lock pins them. NO boto3 on purpose -- lambda ships its own
dependencies = [
  "urllib3>=2",       # the discord + cloudformation http calls
]

# just a zipped folder, not a package -- same as operations, see the note there
[tool.uv]
package = false


# ==========================================================================================
#                                 PYTEST
# ==========================================================================================
# own folder = own pytest world -- see the note in lambda/operations/pyproject.toml
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
