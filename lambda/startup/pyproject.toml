# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                               CraftForm                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  STARTUP LAMBDA  ::  pyproject.toml                                        ║
# ║  What this lambda needs to run (what ships in the zip).                    ║
# ║  dev tools are in the root one                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[project]
name = "craftform-startup"
version = "0.0.0"               # unused, git tags version the releases
requires-python = "==3.12.*"    # the lambda runtime

# minimum versions, uv.lock pins them. no boto3 because lambda ships its own
dependencies = [
  "urllib3>=2",       # discord and cloudformation http calls
]

# just a zipped folder, same as operations
[tool.uv]
package = false


# ==========================================================================================
#                                 PYTEST
# ==========================================================================================
# its own pytest, same as operations
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
