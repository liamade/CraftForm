# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                               CraftForm                                    ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  CODEBUILD  ::  pyproject.toml                                             ║
# ║  What the AMI bake needs to run in codebuild. dev tools are in the root one║
# ╚══════════════════════════════════════════════════════════════════════════════╝

[project]
name = "craftform-server"       # matches the codebuild project and server.zip
version = "0.0.0"               # unused, git tags version the releases
requires-python = "==3.12.*"    # matches python 3.12 in buildspec.yaml

# minimum versions, uv.lock pins them. boto3 IS here because codebuild doesn't come with one
# (the stubs are dev only, that's why bake.py imports them under TYPE_CHECKING)
dependencies = [
  "boto3>=1.43.114",  # ec2 and ssm
  "urllib3>=2",       # discord followup webhook
]

# just a zipped folder, same as the lambdas
[tool.uv]
package = false


# ==========================================================================================
#                                 PYTEST
# ==========================================================================================
# its own pytest, same as the lambdas
[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
