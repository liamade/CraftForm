
#╔══════════════════════════════════════════════════════════════════════════════╗
#║                                  CraftForm                                   ║
#╠══════════════════════════════════════════════════════════════════════════════╣
#║  GITHUB ACTIONS  ::  release.yaml                                            ║
#║  Builds every artifact a CraftForm install pulls down -- the startup and     ║
#║  operations lambda zips, the server bake zip, plus the terraform source      ║
#║  with its buildspec riding inside it -- then publishes them as GitHub        ║
#║  release assets for the bootstrap stager to pull. The workflow is not        ║
#║  heavy enough to qualify for a matrix approach                               ║
#╚══════════════════════════════════════════════════════════════════════════════╝


name: Release Workflow


#============================================================
#                 TRIGGER SETTINGS
#============================================================
on:

  # MANUAL TRIGGER: allow manual triggers and require a version number input for the release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release (e.g., v1.2.3)'
        required: true
      prerelease:
        description: 'Set to TRUE if it is a prerelease'
        type: boolean
        default: false

  # AUTOMATIC TRIGGER: trigger on new version tags being pushed in the repo      
  push:
    tags: ['v*.*.*'] # trigger on version tags like v1.2.3

# GIT PERMISSIONS: allow the git token to write to repo
permissions:
  contents: write    # needed to create releases and upload assets

# PYTHON PACKAGES: every python folder that ships. each one becomes <folder name>.zip,
# built from the uv package craftform-<folder name>
env:
  PACKAGES: lambda/startup lambda/operations codebuild/server



#============================================================
#                 JOB EXECUTION
#============================================================

jobs:

  # RELEASE JOB: job for building every artifact an install pulls down, creating the new release, and uploading them
  release:
    if: github.repository == 'Liamade/CraftForm' # only run this workflow in the main repo, not in forks
    runs-on: ubuntu-latest

    steps:

      # CHECKOUT AND SETUP: check out the code
      - name: Checkout Repository 
        uses: actions/checkout@v7

      # UV + PYTHON SETUP: python 3.12 for building the python code, uv to pull its deps out of uv.lock
      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.5'       # pkgs.uv -- see the note in lambda-ci.yaml
          python-version: '3.12'


      # BUILD PYTHON CODE: install dependencies and build each python package into a zip file for distribution
      - name: Build Python Code
        run: |
          # BUILD OUT EVERY PYTHON PACKAGE -- the two lambdas and the server bake, all the same way
          for dir in $PACKAGES; do
            name=$(basename $dir)   # lambda/startup -> startup, codebuild/server -> server


            # DEPENDENCIES -- pull this package's runtime deps out of uv.lock and install them INTO the zip.
            # --locked breaks the release if the lock is stale. lands in RUNNER_TEMP so it stays out of the zip
            uv export --package craftform-$name --no-dev --locked --no-emit-workspace \
              -o "$RUNNER_TEMP/$name-requirements.txt"
            # --python-platform: grab the builds that run on LAMBDA's linux (glibc 2.34), not whatever
            # suits this runner -- a newer runner could otherwise pull a pynacl that lambda can't load
            uv pip install -r "$RUNNER_TEMP/$name-requirements.txt" --target lambda-build/$name \
              --python-platform x86_64-manylinux_2_34 --python-version 3.12

            # COPY DIRECTORY -- copy everthing except certain files
            rsync -a \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.mypy_cache' \
              --exclude='.pytest_cache' \
              --exclude='pyproject.toml' \
              $dir/ lambda-build/$name/

            # ZIP FILES -- zip files to make an actual release
            (
              cd lambda-build/$name
              zip -r ../../$name.zip .
            )

          done

          # SANITY CHECK -- codebuild reads buildspec.yaml from the ROOT of server.zip, so same deal
          # as terraform.zip below: break the release here instead of every /server create :(
          unzip -l server.zip buildspec.yaml >/dev/null || { echo "buildspec.yaml missing from server.zip :("; exit 1; }

      # BUILD TERRAFORM SOURCE: the codebuild project pulls this down and runs it on every /region create or delete
      - name: Build Terraform Source
        run: |
          # BUILD OUT THE TERRAFORM SOURCE

          # ZIP FILES -- zip from INSIDE the dir so main.tf lands at the root, same shape as
          # the lambda zips. the .terraform.lock.hcl rides along on purpose, it pins the providers
          (
            cd terraform
            zip -r ../terraform.zip . -x '.terraform/*' '*.tfstate*'
          )

          # BUILDSPEC -- has to sit at the ROOT of the zip, that's where codebuild reads it from.
          # -j drops the path so it lands next to main.tf instead of in a subdir.
          # NOTE: codebuild only auto-finds "buildspec.yml", so since ours is .yaml to match the
          # rest of the repo, the project has to name it explicitly -> BuildSpec: buildspec.yaml
          zip -j terraform.zip codebuild/region/buildspec.yaml

          # SANITY CHECK -- if the buildspec didn't make it in, every region deploy is dead, so
          # break the release here instead of letting a user find out weeks later :(
          unzip -l terraform.zip | grep -q 'buildspec.yaml' || { echo "buildspec.yaml missing from terraform.zip :("; exit 1; }

      # CREATE GITHUB RELEASE: create a new release in GitHub using the version number from the workflow input
      - name: Publish Release
        id: release  # capture the output of this step to get the release ID
        uses: softprops/action-gh-release@v3
        with:
          name: CraftForm ${{ inputs.version || github.ref_name }} # set the release name
          tag_name: ${{ inputs.version || github.ref_name }} # set the tag name to the version tag
          target_commitish: ${{ github.sha }} # set the target commit for the release to the current commit that triggered the workflow
          generate_release_notes: true # let the action generate release notes based on merged PRs and commits
          fail_on_unmatched_files: true # fail if the files to upload are not found
          
          files: |
            startup.zip
            operations.zip
            server.zip
            terraform.zip
  
